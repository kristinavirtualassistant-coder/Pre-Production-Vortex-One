name: Vortex One CI

on:
  push:
    branches:
      - main
      - 'release/*'
      - 'qa/production-readiness'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * 1-5'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vortex_one_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vortex_one_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vortex_one_test
      SQL_HOST: 127.0.0.1
      SQL_PORT: "5432"
      SQL_DB_NAME: vortex_one_test
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_SSL: "false"
      AUTH_SESSION_PEPPER: ci-only-session-pepper-32-characters-minimum
      VORTEX_ONE_SEED_DEMO_DATA: "0"
      VORTEX_ONE_SKIP_LIVE_GIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run deterministic PostgreSQL integration suite
        run: npm test

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vortex_one_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vortex_one_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vortex_one_test
      SQL_HOST: 127.0.0.1
      SQL_PORT: "5432"
      SQL_DB_NAME: vortex_one_test
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_SSL: "false"
      AUTH_SESSION_PEPPER: ci-only-session-pepper-32-characters-minimum
      VORTEX_ONE_SEED_DEMO_DATA: "0"
      VORTEX_ONE_SKIP_LIVE_GIS: "1"
      E2E_PORT: "4173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome
      - name: Run browser smoke test
        run: npm run test:e2e:smoke

  live-gis:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vortex_one_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vortex_one_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vortex_one_test
      SQL_HOST: 127.0.0.1
      SQL_PORT: "5432"
      SQL_DB_NAME: vortex_one_test
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_SSL: "false"
      AUTH_SESSION_PEPPER: ci-only-session-pepper-32-characters-minimum
      VORTEX_ONE_SEED_DEMO_DATA: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run live government GIS integration suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee live-gis-output.log
          grep -Fq "Executing Live Query against Orange County Public Works GIS..." live-gis-output.log
          grep -Fq "Executing Live Query against Los Angeles County Assessor GIS..." live-gis-output.log
          ! grep -Fq "Skipping live government GIS integration tests" live-gis-output.log
