      - name: Remove Firebase packages and refresh lockfile
        if: steps.guard.outputs.already-cleaned == 'false'
        run: npm uninstall firebase firebase-admin --ignore-scripts

      - name: Verify no Firebase runtime remains
        if: steps.guard.outputs.already-cleaned == 'false'
        shell: bash
        run: |
          if git grep -nE "from ['\"]firebase(/|['\"])|from ['\"]firebase-admin(/|['\"])|require\(['\"]firebase" -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs'; then
            echo 'Firebase runtime import remains.'
            exit 1
          fi
          if grep -n '"firebase"\|"firebase-admin"' package.json; then
            echo 'Firebase package remains in package.json.'
            exit 1
          fi

      - name: Validate dependency graph and application
        if: steps.guard.outputs.already-cleaned == 'false'
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

      - name: Commit validated cleanup
        if: steps.guard.outputs.already-cleaned == 'false'
        shell: bash
        run: |
          rm -f .github/workflows/postgresql-only-auth-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(auth): remove Firebase runtime dependencies [auth-cleanup]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
