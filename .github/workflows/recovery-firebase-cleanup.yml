name: Recovery Firebase Cleanup

on:
  push:
    branches:
      - refactor/postgresql-only-auth-recovery

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/postgresql-only-auth-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove Firebase runtime and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          for filename in ('src/components/GoogleDriveView.tsx', 'src/components/GoogleSheetsSyncModal.tsx'):
              p = Path(filename)
              s = p.read_text()
              s = s.replace("import { User } from 'firebase/auth';\n", "")
              s = s.replace("import { getCachedToken, signInWithGoogle, getOAuthUser   DriveOAuthUser,\n", "import { getCachedToken, signInWithGoogle, getOAuthUser, DriveOAuthUser,\n")
              if 'DriveOAuthUser' not in s:
                  marker = "} from '../lib/driveAuth';"
                  if marker in s:
                      s = s.replace(marker, "  DriveOAuthUser,\n} from '../lib/driveAuth';")
              s = s.replace('useState<User | null>(null)', 'useState<DriveOAuthUser | null>(null)')
              p.write_text(s)
          p = Path('server.ts')
          s = p.read_text().replace("import { getFirestore } from 'firebase-admin/firestore';\n", "").replace("const getFirestoreDb = () => getFirestore();\n", "")
          p.write_text(s)
          p = Path('package.json')
          data = json.loads(p.read_text())
          for section in ('dependencies', 'devDependencies', 'optionalDependencies'):
              if section in data:
                  data[section].pop('firebase', None)
                  data[section].pop('firebase-admin', None)
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          rm -f firebase-applet-config.json firebase-blueprint.json firestore.rules
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git grep -n -E "from ['\"]firebase|require\(['\"]firebase|firebase-admin|firebase/app|firebase/auth|firebase/firestore" -- 'src' 'server' '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.json' 2>/dev/null; then
            echo 'ERROR: Firebase runtime references remain.'
            exit 1
          fi
      - name: Commit cleanup to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/complete-firebase-removal.yml firebase-removal-trigger.txt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(auth): complete Firebase runtime removal'
          git push origin HEAD:refactor/postgresql-only-auth-recovery
