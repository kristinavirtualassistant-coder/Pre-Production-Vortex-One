name: One-time migration credential patch

on:
  push:
    branches:
      - fix/postgres-migration-runtime-credentials

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch database credential separation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('server/db/db.ts')
          text = path.read_text()

          marker = "  const isPostgresConfigured = !!config;\n"
          if marker not in text:
              raise SystemExit('database initialization marker not found')

          if 'const migrationUser = process.env.SQL_ADMIN_USER || user;' not in text:
              text = text.replace(
                  marker,
                  marker + "  // Keep application credentials least-privileged; migrations may use a separate admin login.\n  const migrationUser = process.env.SQL_ADMIN_USER || user;\n  const migrationPassword = process.env.SQL_ADMIN_PASSWORD || password;\n",
                  1,
              )

          old_pool = """      pgPool = new Pool({\n        host: host,\n        port: port,\n        user: user,\n        password: password,\n        database: database,\n        max: 10,\n        connectionTimeoutMillis: 5000,\n        ssl: process.env.SQL_SSL === 'true' ? { rejectUnauthorized: false } : undefined,\n      });\n\n      const client = await pgPool.connect();"""
          new_pool = """      const migrationPool = new Pool({\n        host: host,\n        port: port,\n        user: migrationUser,\n        password: migrationPassword,\n        database: database,\n        max: 2,\n        connectionTimeoutMillis: 5000,\n        ssl: process.env.SQL_SSL === 'true' ? { rejectUnauthorized: false } : undefined,\n      });\n\n      const client = await migrationPool.connect();"""
          if old_pool not in text:
              raise SystemExit('expected PostgreSQL pool block not found')
          text = text.replace(old_pool, new_pool, 1)

          text = text.replace(
              "      } finally {\n        client.release();\n      }\n",
              "      } finally {\n        client.release();\n        await migrationPool.end();\n      }\n\n      // The application pool always uses the restricted runtime credentials.\n      pgPool = new Pool({\n        host,\n        port,\n        user,\n        password,\n        database,\n        max: 10,\n        connectionTimeoutMillis: 5000,\n        ssl: process.env.SQL_SSL === 'true' ? { rejectUnauthorized: false } : undefined,\n      });\n",
              1,
          )

          text = text.replace(
              "      if (pgPool) {\n        pgPool.end().catch(() => {});\n        pgPool = null;\n      }",
              "      if (pgPool) {\n        pgPool.end().catch(() => {});\n        pgPool = null;\n      }\n      if (typeof migrationPool !== 'undefined' && migrationPool) {\n        migrationPool.end().catch(() => {});\n      }",
              1,
          )

          path.write_text(text)

      - name: Add migration credential tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/test/databaseConfig.test.ts')
          text = path.read_text()
          if "SQL_ADMIN_USER" not in text:
              text += r'''\n\ndescribe('database migration credential separation', () => {\n  it('keeps runtime credentials independent from migration credentials', async () => {\n    const env = {\n      SQL_HOST: 'db.example.test',\n      SQL_PORT: '5432',\n      SQL_USER: 'runtime_user',\n      SQL_PASSWORD: 'runtime_password',\n      SQL_ADMIN_USER: 'migration_user',\n      SQL_ADMIN_PASSWORD: 'migration_password',\n      SQL_DB_NAME: 'vortex_one',\n      SQL_SSL: 'true',\n    };\n\n    const runtime = getDatabaseConnectionConfig(env);\n    expect(runtime).toMatchObject({\n      user: 'runtime_user',\n      password: 'runtime_password',\n      database: 'vortex_one',\n      ssl: true,\n    });\n    expect(runtime?.user).not.toBe(env.SQL_ADMIN_USER);\n    expect(runtime?.password).not.toBe(env.SQL_ADMIN_PASSWORD);\n  });\n});\n'''
              path.write_text(text)
          PY

      - name: Commit patched files and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-migration-credentials.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db/db.ts server/test/databaseConfig.test.ts .github/workflows/patch-migration-credentials.yml
          git commit -m "fix: separate migration and runtime postgres credentials"
          git push
