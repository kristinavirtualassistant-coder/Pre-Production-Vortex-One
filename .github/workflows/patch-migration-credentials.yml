name: One-time migration credential patch

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/postgres-migration-runtime-credentials

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch database credential separation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('server/db/db.ts')
          text = path.read_text()
          marker = "  const isPostgresConfigured = !!config;\n"
          if marker not in text:
              raise SystemExit('database initialization marker not found')
          if 'const migrationUser = process.env.SQL_ADMIN_USER || user;' not in text:
              text = text.replace(marker, marker + "  // Keep application credentials least-privileged; migrations may use a separate admin login.\n  const migrationUser = process.env.SQL_ADMIN_USER || user;\n  const migrationPassword = process.env.SQL_ADMIN_PASSWORD || password;\n", 1)

          pattern = re.compile(r"(?P<indent>\s*)pgPool = new Pool\(\{\n(?P<body>.*?\n\s*\}\);\n\n\s*const client = await pgPool\.connect\(\);)", re.DOTALL)
          match = pattern.search(text)
          if not match:
              raise SystemExit('PostgreSQL startup pool block not found')
          body = match.group('body')
          body = re.sub(r"\buser:\s*user,", "user: migrationUser,", body, count=1)
          body = re.sub(r"\bpassword:\s*password,", "password: migrationPassword,", body, count=1)
          replacement = match.group(0).replace('pgPool = new Pool', 'const migrationPool = new Pool', 1)
          replacement = replacement.replace(match.group('body'), body.replace('const client = await pgPool.connect();', 'const client = await migrationPool.connect();'), 1)
          text = text[:match.start()] + replacement + text[match.end():]

          old_finally = """      } finally {\n        client.release();\n      }\n"""
          if old_finally not in text:
              raise SystemExit('migration cleanup block not found')
          new_finally = """      } finally {\n        client.release();\n        await migrationPool.end();\n      }\n\n      // The application pool always uses the restricted runtime credentials.\n      pgPool = new Pool({\n        host,\n        port,\n        user,\n        password,\n        database,\n        max: 10,\n        connectionTimeoutMillis: 5000,\n        ssl: process.env.SQL_SSL === 'true' ? { rejectUnauthorized: false } : undefined,\n      });\n"""
          text = text.replace(old_finally, new_finally, 1)
          path.write_text(text)

      - name: Add migration credential tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/test/databaseConfig.test.ts')
          text = path.read_text()
          if "database migration credential separation" not in text:
              text += r'''\n\ndescribe('database migration credential separation', () => {\n  it('keeps runtime credentials independent from migration credentials', () => {\n    const env = {\n      SQL_HOST: 'db.example.test',\n      SQL_PORT: '5432',\n      SQL_USER: 'runtime_user',\n      SQL_PASSWORD: 'runtime_password',\n      SQL_ADMIN_USER: 'migration_user',\n      SQL_ADMIN_PASSWORD: 'migration_password',\n      SQL_DB_NAME: 'vortex_one',\n      SQL_SSL: 'true',\n    };\n\n    const runtime = getDatabaseConnectionConfig(env);\n    expect(runtime).toMatchObject({ user: 'runtime_user', password: 'runtime_password', database: 'vortex_one', ssl: true });\n    expect(runtime?.user).not.toBe(env.SQL_ADMIN_USER);\n    expect(runtime?.password).not.toBe(env.SQL_ADMIN_PASSWORD);\n  });\n});\n'''
              path.write_text(text)
          PY

      - name: Commit patched files and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-migration-credentials.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db/db.ts server/test/databaseConfig.test.ts .github/workflows/patch-migration-credentials.yml
          git commit -m "fix: separate migration and runtime postgres credentials"
          git push --force origin HEAD:fix/postgres-migration-runtime-credentials
