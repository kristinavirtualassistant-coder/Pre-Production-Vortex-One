name: Deploy Vortex One frontend to Netlify

on:
  workflow_run:
    workflows: ["Vortex One CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_SITE_ID: 7fe2e99d-37ee-426c-84b9-117b7bff7325
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:client

      - name: Add SPA fallback
        run: printf '%s\\n' '/* /index.html 200' > dist/_redirects

      - name: Deploy prebuilt frontend
        working-directory: dist
        run: npx --yes netlify-cli@23.6.0 deploy --prod --dir=. --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
