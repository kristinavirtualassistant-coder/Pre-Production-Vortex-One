name: Final PostgreSQL Server Cleanup

on:
  push:
    branches:
      - refactor/postgresql-only-auth-recovery

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/postgresql-only-auth-recovery
          fetch-depth: 0
      - name: Apply PostgreSQL server boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/PropertiesView.tsx')
          p.write_text(p.read_text().replace("import firebaseConfig from '../../firebase-applet-config.json';\n", ""))

          p = Path('server.ts')
          s = p.read_text()
          if "import { randomUUID } from 'node:crypto';\n" not in s:
              s = s.replace("import fs from 'fs';\n", "import fs from 'fs';\nimport { randomUUID } from 'node:crypto';\n", 1)

          start = s.find('  // --- Dialer Metrics API')
          end = s.find("  app.post('/api/calls/:id/drop-voicemail'", start)
          if start < 0 or end < 0:
              raise SystemExit(f'Could not locate legacy dialer block: start={start}, end={end}')

          block = '''  // --- Dialer Metrics API (PostgreSQL authoritative) ---
  app.get('/api/dialer/metrics', async (req, res) => {
    try {
      const orgId = requireOrganizationId((req as AuthRequest).dbUser?.organization_id);
      const pool = getPgPool();
      if (!pool) return res.status(503).json({ error: 'Dialer metrics require PostgreSQL', code: 'DIALER_DATABASE_UNAVAILABLE' });
      const result = await pool.query(`
        SELECT DATE(created_at) AS date,
               COUNT(*)::int AS call_volume,
               COUNT(*) FILTER (WHERE status IN ('completed', 'connected'))::int AS successful_dials,
               COUNT(*) FILTER (WHERE disposition IN ('left_voicemail', 'voicemail'))::int AS voicemails_sent
        FROM call
        WHERE organization_id = $1
        GROUP BY DATE(created_at)
        ORDER BY date DESC
        LIMIT 7
      `, [orgId]);
      res.json(result.rows.map((row) => ({
        id: `metric_${row.date}`,
        organization_id: orgId,
        date: row.date,
        call_volume: row.call_volume,
        success_rate: row.call_volume ? Number(((row.successful_dials / row.call_volume) * 100).toFixed(1)) : 0,
        avg_talk_time: 0,
        abandonment_rate: 0,
        voicemails_sent: row.voicemails_sent,
      })));
    } catch (err: any) {
      res.status(500).json({ error: 'Unable to load dialer metrics from PostgreSQL' });
    }
  });

  // --- Voicemail Drop Library API (PostgreSQL authoritative) ---
  const ensureVoicemailLibrary = async (pool: ReturnType<typeof getPgPool>) => {
    if (!pool) return false;
    await pool.query(`
      CREATE TABLE IF NOT EXISTS voicemail_library (
        id VARCHAR(64) PRIMARY KEY,
        organization_id VARCHAR(64) NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
        label VARCHAR(255) NOT NULL,
        url VARCHAR(2048) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP NOT NULL,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP NOT NULL
      )
    `);
    await pool.query('CREATE INDEX IF NOT EXISTS idx_voicemail_library_org ON voicemail_library(organization_id, created_at DESC)');
    return true;
  };

  app.get('/api/dialer/voicemails', async (req, res) => {
    try {
      const orgId = requireOrganizationId((req as AuthRequest).dbUser?.organization_id);
      const pool = getPgPool();
      if (!pool) return res.status(503).json({ error: 'Voicemail library requires PostgreSQL', code: 'VOICEMAIL_DATABASE_UNAVAILABLE' });
      await ensureVoicemailLibrary(pool);
      const result = await pool.query(
        'SELECT id, organization_id, label, url, created_at, updated_at FROM voicemail_library WHERE organization_id = $1 ORDER BY created_at DESC',
        [orgId]
      );
      res.json(result.rows);
    } catch (err: any) {
      res.status(500).json({ error: 'Unable to load voicemail library from PostgreSQL' });
    }
  });

  app.post('/api/dialer/voicemails', async (req, res) => {
    try {
      const orgId = requireOrganizationId((req as AuthRequest).dbUser?.organization_id);
      const { label, url } = req.body;
      if (typeof label !== 'string' || !label.trim() || typeof url !== 'string' || !url.trim()) {
        return res.status(400).json({ error: 'Voicemail label and URL are required' });
      }
      const pool = getPgPool();
      if (!pool) return res.status(503).json({ error: 'Voicemail library requires PostgreSQL', code: 'VOICEMAIL_DATABASE_UNAVAILABLE' });
      await ensureVoicemailLibrary(pool);
      const result = await pool.query(
        `INSERT INTO voicemail_library (id, organization_id, label, url)
         VALUES ($1, $2, $3, $4)
         RETURNING id, organization_id, label, url, created_at, updated_at`,
        [`vm_${randomUUID()}`, orgId, label.trim(), url.trim()]
      );
      res.status(201).json(result.rows[0]);
    } catch (err: any) {
      res.status(500).json({ error: 'Unable to create voicemail in PostgreSQL' });
    }
  });

  app.delete('/api/dialer/voicemails/:id', async (req, res) => {
    try {
      const orgId = requireOrganizationId((req as AuthRequest).dbUser?.organization_id);
      const pool = getPgPool();
      if (!pool) return res.status(503).json({ error: 'Voicemail library requires PostgreSQL', code: 'VOICEMAIL_DATABASE_UNAVAILABLE' });
      await ensureVoicemailLibrary(pool);
      const result = await pool.query(
        'DELETE FROM voicemail_library WHERE id = $1 AND organization_id = $2 RETURNING id',
        [req.params.id, orgId]
      );
      if (!result.rowCount) return res.status(404).json({ error: 'Voicemail not found' });
      res.json({ success: true, deletedId: result.rows[0].id });
    } catch (err: any) {
      res.status(500).json({ error: 'Unable to delete voicemail from PostgreSQL' });
    }
  });

  app.post('/api/calls/:id/drop-voicemail' '''
          s = s[:start] + block + s[end + len("  app.post('/api/calls/:id/drop-voicemail'"):]
          p.write_text(s)
          PY
          if git grep -n -E "from ['\"]firebase|require\(['\"]firebase|firebase-admin|firebase/app|firebase/auth|firebase/firestore|firebase-applet-config|getFirestoreDb" -- 'src' 'server' '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.json' 2>/dev/null; then
            echo 'ERROR: Firebase or Firestore runtime references remain.'
            exit 1
          fi
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/fix-server-firebase.yml .github/workflows/complete-firebase-removal.yml .github/workflows/postgres-dialer-boundary-fix.yml .github/workflows/postgres-dialer-boundary-fix-v2.yml .github/workflows/final-auth-type-fix.yml cleanup-trigger-2.txt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(auth): complete PostgreSQL-only server boundary'
          git push origin HEAD:refactor/postgresql-only-auth-recovery
