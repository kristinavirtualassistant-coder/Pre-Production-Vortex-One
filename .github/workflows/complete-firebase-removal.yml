name: Complete Firebase Removal

on:
  push:
    branches:
      - refactor/postgresql-only-auth-recovery

permissions:
  contents: write

jobs:
  remove-firebase:
    runs-on: ubuntu-latest
    if: github.actor == 'kristinavirtualassistant-coder'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/postgresql-only-auth-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove remaining Firebase runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/GoogleDriveView.tsx')
          s = p.read_text()
          s = s.replace("import { User } from 'firebase/auth';\n", "")
          s = s.replace("  initAuth,\n", "  initAuth,\n  DriveOAuthUser,\n")
          s = s.replace('useState<User | null>(null)', 'useState<DriveOAuthUser | null>(null)')
          p.write_text(s)

          p = Path('server.ts')
          s = p.read_text()
          s = s.replace("import { getFirestore } from 'firebase-admin/firestore';\n", "")
          s = s.replace("const getFirestoreDb = () => getFirestore();\n", "")
          p.write_text(s)

          p = Path('package.json')
          import json
          data = json.loads(p.read_text())
          for section in ('dependencies', 'devDependencies', 'optionalDependencies'):
              if section in data:
                  data[section].pop('firebase', None)
                  data[section].pop('firebase-admin', None)
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

          rm -f firebase-applet-config.json firebase-blueprint.json firestore.rules

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

          if git grep -n -E "from ['\"]firebase|require\(['\"]firebase|firebase-admin|firebase/app|firebase/auth|firebase/firestore" -- 'src' 'server' '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.json' 2>/dev/null; then
            echo 'ERROR: Firebase runtime references remain.'
            exit 1
          fi

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'chore(auth): remove Firebase runtime and dependencies'
          git push origin HEAD:refactor/postgresql-only-auth-recovery
