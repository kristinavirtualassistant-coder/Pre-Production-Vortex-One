name: PR30 final PostgreSQL repair

on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-pr30-final.trigger]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/postgresql-only-auth-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.ts')
          s=p.read_text()
          s=s.replace("import { getFirestore } from 'firebase-admin/firestore';\n", '')
          s=s.replace("// Firebase Admin is initialized idempotently by the shared middleware module.\nconst getFirestoreDb = () => getFirestore();\n", '')
          s=s.replace("const snapshot = await getFirestoreDb().collection('dialer_metrics')\n          .where('organization_id', '==', orgId)\n          .orderBy('date', 'desc')\n          .limit(7)\n          .get();\n        if (!snapshot.empty) {\n          return res.json(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));\n        }", "const pool = getPgPool();\n        if (pool) {\n          const result = await pool.query(\`SELECT COUNT(*)::int AS call_volume, COUNT(*) FILTER (WHERE status = 'completed')::int AS completed_calls, COALESCE(AVG(duration_seconds) FILTER (WHERE status = 'completed'), 0)::float AS avg_talk_time FROM call WHERE organization_id = $1 AND created_at >= CURRENT_TIMESTAMP - INTERVAL '7 days'\`, [orgId]);\n          const row = result.rows[0] || {};\n          const volume = Number(row.call_volume) || 0;\n          const completed = Number(row.completed_calls) || 0;\n          return res.json([{ organization_id: orgId, date: new Date().toISOString().split('T')[0], call_volume: volume, success_rate: volume ? Number(((completed / volume) * 100).toFixed(1)) : 0, avg_talk_time: Number(row.avg_talk_time) || 0, abandonment_rate: volume ? Number((((volume - completed) / volume) * 100).toFixed(1)) : 0 }]);\n        }\n        return res.status(503).json({ error: 'Dialer metrics require PostgreSQL' });")
          s=s.replace("const snapshot = await getFirestoreDb().collection('voicemails')\n          .where('organization_id', '==', orgId)\n          .get();\n        if (!snapshot.empty) {\n          return res.json(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));\n        }", "const pool = getPgPool();\n        if (!pool) return res.status(503).json({ error: 'Voicemail library requires PostgreSQL' });\n        await pool.query(\`CREATE TABLE IF NOT EXISTS voicemail_library (id VARCHAR(64) PRIMARY KEY, organization_id VARCHAR(64) NOT NULL REFERENCES organizations(id) ON DELETE CASCADE, label VARCHAR(255) NOT NULL, url VARCHAR(2048) NOT NULL, created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP NOT NULL); CREATE INDEX IF NOT EXISTS idx_voicemail_library_org ON voicemail_library(organization_id, created_at DESC);\`);\n        const result = await pool.query(\`SELECT id, organization_id, label, url, created_at FROM voicemail_library WHERE organization_id = $1 ORDER BY created_at DESC\`, [orgId]);\n        return res.json(result.rows);")
          s=s.replace("const snapshot = await getFirestoreDb().collection('voicemails').doc(id).set(data);", "const pool = getPgPool();\n        if (!pool) return res.status(503).json({ error: 'Voicemail library requires PostgreSQL' });\n        await pool.query(\`CREATE TABLE IF NOT EXISTS voicemail_library (id VARCHAR(64) PRIMARY KEY, organization_id VARCHAR(64) NOT NULL REFERENCES organizations(id) ON DELETE CASCADE, label VARCHAR(255) NOT NULL, url VARCHAR(2048) NOT NULL, created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP NOT NULL);\`);\n        await pool.query(\`INSERT INTO voicemail_library (id, organization_id, label, url) VALUES ($1,$2,$3,$4)\`, [id, orgId, data.label, data.url]);")
          s=s.replace("await getFirestoreDb().collection('voicemails').doc(req.params.id).delete();", "const pool = getPgPool();\n      if (!pool) return res.status(503).json({ error: 'Voicemail library requires PostgreSQL' });\n      await pool.query(\`DELETE FROM voicemail_library WHERE id = $1 AND organization_id = $2\`, [req.params.id, orgId]);")
          if 'getFirestoreDb' in s or 'firebase-admin/firestore' in s:
              raise SystemExit('remaining Firebase server references')
          p.write_text(s)
          props=Path('src/components/PropertiesView.tsx')
          props.write_text(props.read_text().replace("import firebaseConfig from '../../firebase-applet-config.json';\n",''))
          PY
          node -e "const fs=require('fs');const p=require('./package.json');delete p.dependencies?.firebase;delete p.dependencies?.['firebase-admin'];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm -f firebase-applet-config.json firebase-blueprint.json firestore.rules .github/workflows/fix-postgres-boundary.yml postgres-boundary-repair.trigger
          if grep -RInE "from ['\"]firebase|firebase-admin|getFirestoreDb|firebase-applet-config" --exclude-dir=.git --exclude-dir=docs .; then exit 1; fi
          npm ci
          npm run lint
          npm run build
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-pr30-final.yml
          git add -A
          git commit -m 'fix: finish PostgreSQL runtime boundary and Firebase removal'
          git push origin HEAD:refactor/postgresql-only-auth-recovery
