# Render Blueprint: one Docker web service that reads its database connection from the existing Render Postgres.
# Create it in the dashboard: New > Blueprint > pick this repository. Secrets are generated by Render and never committed.
services:
  - type: web
    name: vortex-one-platform
    runtime: docker
    plan: free            # staging only; move to "starter" or higher for production
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SIGNUP_ENABLED
        value: "false"
      # Render's database certificate is self-signed and the connection stays on Render's private network.
      # Turn TLS back on (with DATABASE_SSL_CA) when you move to a paid database.
      - key: SQL_SSL
        value: "false"
      - key: APP_URL
        value: https://vortex-one-platform.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: vortex-one-db
          property: connectionString
      - key: AUTH_SESSION_PEPPER
        generateValue: true
      - key: AUTH_ENCRYPTION_KEY
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: SCHEDULER_TRIGGER_SECRET
        generateValue: true
