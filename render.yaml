services:
  - type: web
    name: vortex-one-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: VORTEX_ONE_SEED_DEMO_DATA
        value: "0"
      - key: VORTEX_ONE_ENABLE_EXTERNAL_WEBHOOKS
        value: "0"
      - key: DATABASE_URL
        sync: false
